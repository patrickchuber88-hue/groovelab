##
## Nginx-Konfiguration für campus-groovelab.de
## Platzieren auf dem Hetzner-Server unter:
## /etc/nginx/sites-available/campus-groovelab.de
## Dann: ln -s /etc/nginx/sites-available/campus-groovelab.de /etc/nginx/sites-enabled/
##

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de;

    return 301 https://$host$request_uri;
}

# HTTPS Hauptserver
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de;

    # ── SSL Zertifikate (Let's Encrypt via certbot) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Dokument-Root (Vite Build Output) ──
    root /var/www/groovelab;
    index index.html;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Komprimierung ──
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── SPA Routing: Alle nicht-gefundenen Pfade → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statische Assets aggressiv cachen ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API Reverse Proxy → Node.js Backend (Port 3001) ──
    # Falls du einen separaten Express/Node-Server betreibst, aktiviere diesen Block:
    # location /api/ {
    #     proxy_pass http://localhost:3001/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
