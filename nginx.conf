##
## Campus-Groovelab Tier-1 Enterprise+ Nginx Hardening Configuration
## DSGVO-konform, Hosting auf Hetzner Rechenzentrum in Deutschland
## Platzieren auf dem Hetzner-Server unter: /etc/nginx/sites-available/campus-groovelab.de
##

# ── 1. Rate-Limiting & Connection-Zones (Im http-Block oder direkt eingebunden) ──
# limit_req_zone $binary_remote_addr zone=cg_login_limit:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=cg_api_limit:10m rate=25r/s;
# limit_conn_zone $binary_remote_addr zone=cg_conn_limit:10m;

# ── 2. Bad Bot & Exploit Scanner Filter ──
# map $http_user_agent $bad_bot {
#     default 0;
#     ~*(sqlmap|nikto|masscan|nmap|dirbuster|gobuster|wpscan|fuzz|acunetix|nessus) 1;
# }

# ── 3. HTTP → HTTPS Redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    # Verhindert Informationspreisgabe
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ── 4. HTTPS Hauptserver (Enterprise+ BSI TR-03116 / DSGVO Standard) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    # ── Informationspreisgabe verhindern ──
    server_tokens off;

    # ── SSL Zertifikate (Let's Encrypt via certbot) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/campus-groovelab.de/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Buffer- & Timeout-Schutz gegen Slowloris & DoS-Attacken ──
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    client_max_body_size 60M;
    large_client_header_buffers 4 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # ── Verbindungsbegrenzung pro IP (Max. 35 gleichzeitige TCP-Sockets) ──
    # limit_conn cg_conn_limit 35;

    # ── Bad Bots & Scanner blockieren ──
    # if ($bad_bot = 1) {
    #     return 403;
    # }

    # ── Dokument-Root (Vite Production Build) ──
    root /var/www/groovelab;
    index index.html;

    # ── BSI TR-03116 & Mozilla Observatory A+ Security Headers ──
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gzip & Brotli Komprimierung ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── 0. Site-Gate Verification Subrequest (Internal Nginx Subrequest < 0.2ms) ──
    location = /_auth_site_gate {
        internal;
        proxy_pass http://127.0.0.1:4000/gate/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # ── Site-Gate UI Fallback (Zero App Bundles Delivered) ──
    location @access_gate {
        try_files /gate.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Allowlist: Standalone Gate Page & Favicon (No Auth Required) ──
    location = /gate.html {
        try_files /gate.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        access_log off;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
    }

    # ── Health-Check Endpoint für Hetzner Uptime-Monitore (Allowlist) ──
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus","datacenter":"hetzner-de"}';
    }

    # ── Service Worker & PWA Manifest (Geschützt durch Site-Gate) ──
    location = /sw.js {
        auth_request /_auth_site_gate;
        error_page 401 = @access_gate;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.json {
        auth_request /_auth_site_gate;
        error_page 401 = @access_gate;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Statische Assets mit Cache-Busting (Geschützt durch Site-Gate) ──
    location /assets/ {
        auth_request /_auth_site_gate;
        error_page 401 = @access_gate;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── SPA Routing mit Site-Gate & Rate-Limiting ──
    location / {
        auth_request /_auth_site_gate;
        error_page 401 = @access_gate;

        # limit_req zone=cg_login_limit burst=10 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # ── CIS-Perimeter Hardening: Hidden Dotfiles & Sensitive Backups ──
    # Block hidden files except .well-known (RFC 9116 security.txt & Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block sensitive backup, dump, environment and configuration files
    location ~* \.(bak|config|sql|tar|gz|zip|env|sh|inc|swp|md)$ {
        deny all;
        return 404;
    }
}
