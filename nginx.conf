##
## Nginx-Konfiguration für campus-groovelab.de
## Platzieren auf dem Hetzner-Server unter:
## /etc/nginx/sites-available/campus-groovelab.de
## Dann: ln -s /etc/nginx/sites-available/campus-groovelab.de /etc/nginx/sites-enabled/
##

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    return 301 https://$host$request_uri;
}

# HTTPS Hauptserver
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    # ── SSL Zertifikate (Let's Encrypt via certbot) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Dokument-Root (Vite Build Output) ──
    root /var/www/groovelab;
    index index.html;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: Erzwingt HTTPS für 1 Jahr (inkl. Subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy: Erlaubt nur vertrauenswürdige Quellen
    # 'unsafe-inline' für <style>-Tags (React-Pattern), keine eval()-Ausführung
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none';" always;

    # Permissions Policy: Kamera/Mikro/Geo nur für den eigenen Ursprung erlaubt
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=()" always;

    # ── Gzip Komprimierung ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Health-Check Endpoint ──
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus"}';
    }

    # ── SPA Routing: Alle nicht-gefundenen Pfade → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statische Assets aggressiv cachen ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── API Reverse Proxy → Node.js Backend (Port 3001) ──
    # Falls du einen separaten Express/Node-Server betreibst, aktiviere diesen Block:
    # location /api/ {
    #     proxy_pass http://localhost:3001/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
