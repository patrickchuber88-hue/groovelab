##
## Campus-Groovelab Tier-1 Enterprise+ Nginx Hardening Configuration
## 100% DSGVO-konform, Hosting auf Hetzner Rechenzentrum in Deutschland
## Platzieren auf dem Hetzner-Server unter: /etc/nginx/sites-available/campus-groovelab.de
##

# ── 1. Rate-Limiting & Connection-Zones (Im http-Block oder direkt eingebunden) ──
# limit_req_zone $binary_remote_addr zone=cg_login_limit:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=cg_api_limit:10m rate=25r/s;
# limit_conn_zone $binary_remote_addr zone=cg_conn_limit:10m;

# ── 2. Bad Bot & Exploit Scanner Filter ──
# map $http_user_agent $bad_bot {
#     default 0;
#     ~*(sqlmap|nikto|masscan|nmap|dirbuster|gobuster|wpscan|fuzz|acunetix|nessus) 1;
# }

# ── 3. HTTP → HTTPS Redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    # Verhindert Informationspreisgabe
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ── 4. HTTPS Hauptserver (Enterprise+ BSI TR-03116 / DSGVO Standard) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    # ── Informationspreisgabe verhindern ──
    server_tokens off;

    # ── SSL Zertifikate (Let's Encrypt via certbot) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Buffer- & Timeout-Schutz gegen Slowloris & DoS-Attacken ──
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    client_max_body_size 60M;
    large_client_header_buffers 4 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # ── Verbindungsbegrenzung pro IP (Max. 35 gleichzeitige TCP-Sockets) ──
    # limit_conn cg_conn_limit 35;

    # ── Bad Bots & Scanner blockieren ──
    # if ($bad_bot = 1) {
    #     return 403;
    # }

    # ── Dokument-Root (Vite Production Build) ──
    root /var/www/groovelab;
    index index.html;

    # ── BSI TR-03116 & Mozilla Observatory A+ Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # HSTS: Erzwingt HTTPS für 2 Jahre inkl. Subdomains & Preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy (100% Self-Hosted, DSGVO-Reinform ohne externe Tracker/CDNs)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de https://*.supabase.co wss://*.supabase.co; media-src 'self' blob: data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Hardware Permissions Policy: Kamera/Mikrofon nur für die eigene Web-App
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), bluetooth=()" always;

    # ── Gzip & Brotli Komprimierung ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Health-Check Endpoint für Hetzner Uptime-Monitore ──
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus","datacenter":"hetzner-de"}';
    }

    # ── Service Worker & PWA Manifest (Nie cachen für sofortige Updates) ──
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ── Statische Assets mit Cache-Busting (1 Jahr immutable) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA Routing mit Rate-Limiting gegen Brute-Force ──
    location / {
        # limit_req zone=cg_login_limit burst=10 nodelay;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
