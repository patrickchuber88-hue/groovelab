<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var isGrooveLab = params.get('platform') === 'groovelab' || 
                          window.location.pathname.indexOf('/onboarding') !== -1 || 
                          window.location.pathname.indexOf('/device-onboarding') !== -1 || 
                          localStorage.getItem('groovelab_active_platform') === 'groovelab';
        
        var manifestHref = isGrooveLab ? '/manifest-groovelab.json' : '/manifest.json';
        var themeColor = isGrooveLab ? '#eab308' : '#34a853';
        var title = isGrooveLab ? 'GrooveLab' : 'Campus';
        var appleTouchIcon = isGrooveLab ? '/pwa-icon-groovelab.png' : '/apple-touch-icon.png';
        var favicon = isGrooveLab ? '/pwa-icon-groovelab.png' : '/pwa-icon.png';
        
        document.write('<link rel="manifest" href="' + manifestHref + '" />');
        document.write('<meta name="theme-color" content="' + themeColor + '" />');
        document.write('<meta name="apple-mobile-web-app-title" content="' + title + '" />');
        document.write('<link rel="apple-touch-icon" href="' + appleTouchIcon + '" />');
        document.write('<link rel="icon" type="image/png" href="' + favicon + '" />');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        alert('Global Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        alert('Unhandled Promise Rejection: ' + (e.reason ? e.reason.message || e.reason : e));
      });
    </script>
    <title>Groovelab - Gamified Music Learning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
