<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function safeGetItem(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        var params = new URLSearchParams(window.location.search);
        var platformParam = params.get('platform');
        var isGrooveLab = platformParam === 'groovelab' || 
                          (platformParam !== 'campus' && safeGetItem('groovelab_active_platform') === 'groovelab' && window.location.pathname.indexOf('/onboarding') === -1);
        
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var displayMode = 'standalone';
        
        var themeColor = isGrooveLab ? '#eab308' : '#34a853';
        var title = 'Campus-Groovelab';
        var appleTouchIcon = '/apple-touch-icon.png';
        var favicon = '/pwa-icon.png';
        
        var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);

        // Dynamische Manifest-Generierung, um Kiosk-Kopplungsparameter im iOS WebClip/PWA zu erhalten
        var manifestObj;
        if (isGrooveLab) {
          var token = params.get('kiosk_token') || safeGetItem('groovelab_kiosk_token') || '';
          var stationId = params.get('station_id') || safeGetItem('groovelab_station_id') || '';
          var roomId = params.get('kiosk_room_id') || safeGetItem('groovelab_kiosk_room_id') || '';
          
          var startUrl = origin + '/?platform=groovelab';
          if (token && stationId) {
            startUrl += '&kiosk_token=' + encodeURIComponent(token) + '&station_id=' + encodeURIComponent(stationId);
            if (roomId) {
              startUrl += '&kiosk_room_id=' + encodeURIComponent(roomId);
            }
          }
          
          manifestObj = {
            "short_name": "GrooveLab",
            "name": "GrooveLab",
            "icons": [
              {
                "src": origin + "/pwa-icon-groovelab.png",
                "type": "image/png",
                "sizes": "192x192"
              },
              {
                "src": origin + "/pwa-icon-groovelab.png",
                "type": "image/png",
                "sizes": "512x512"
              }
            ],
            "start_url": startUrl,
            "scope": origin + "/",
            "background_color": "#0c0f12",
            "theme_color": "#eab308",
            "display": displayMode,
            "orientation": "any"
          };
        } else {
          manifestObj = {
            "short_name": "Campus-Groovelab",
            "name": "Campus-Groovelab",
            "icons": [
              {
                "src": origin + "/pwa-icon.png",
                "type": "image/png",
                "sizes": "192x192"
              },
              {
                "src": origin + "/pwa-icon.png",
                "type": "image/png",
                "sizes": "512x512"
              }
            ],
            "start_url": origin + "/?platform=campus",
            "scope": origin + "/",
            "background_color": "#062413",
            "theme_color": "#34a853",
            "display": displayMode,
            "orientation": "any"
          };
        }
        
        var manifestHref = isGrooveLab ? '/manifest-groovelab.json' : '/manifest.json';
        try {
          var manifestStr = JSON.stringify(manifestObj);
          if (typeof btoa === 'function') {
            manifestHref = 'data:application/manifest+json;base64,' + btoa(unescape(encodeURIComponent(manifestStr)));
          }
        } catch (e) {
          console.error('[Manifest] Failed to encode dynamic manifest:', e);
        }
        
        function setOrAddMeta(name, content) {
          var meta = document.querySelector('meta[name="' + name + '"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = name;
            document.head.appendChild(meta);
          }
          meta.content = content;
        }

        function setOrAddLink(rel, href, type) {
          var link = document.querySelector('link[rel="' + rel + '"]');
          if (!link) {
            link = document.createElement('link');
            link.rel = rel;
            document.head.appendChild(link);
          }
          link.href = href;
          if (type) link.type = type;
        }

        setOrAddLink('manifest', manifestHref);
        setOrAddMeta('theme-color', themeColor);
        setOrAddMeta('apple-mobile-web-app-title', title);
        setOrAddLink('apple-touch-icon', appleTouchIcon);
        setOrAddLink('icon', favicon, 'image/png');
        setOrAddMeta('apple-mobile-web-app-capable', 'yes');
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-ancestors 'none';" />
    <link rel="preconnect" href="https://tlnstkwffrbljmdtuyot.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tlnstkwffrbljmdtuyot.supabase.co" />
    <title>Campus-Groovelab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
