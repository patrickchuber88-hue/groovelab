<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function safeGetItem(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        var params = new URLSearchParams(window.location.search);
        var platformParam = params.get('platform');
        var isGrooveLab = platformParam === 'groovelab' || 
                          (platformParam !== 'campus' && safeGetItem('groovelab_active_platform') === 'groovelab' && window.location.pathname.indexOf('/onboarding') === -1);
        
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var displayMode = 'standalone';
        
        var themeColor = isGrooveLab ? '#eab308' : '#34a853';
        var title = isGrooveLab ? 'GrooveLab' : 'Campus-Groovelab';
        var appleTouchIcon = isGrooveLab ? '/pwa-icon-groovelab.png' : '/apple-touch-icon.png';
        var favicon = isGrooveLab ? '/pwa-icon-groovelab.png' : '/pwa-icon.png';
        
        // Dynamische Manifest-Generierung, um Kiosk-Kopplungsparameter im iOS WebClip/PWA zu erhalten
        var manifestObj;
        if (isGrooveLab) {
          var token = params.get('kiosk_token') || safeGetItem('groovelab_kiosk_token') || '';
          var stationId = params.get('station_id') || safeGetItem('groovelab_station_id') || '';
          var roomId = params.get('kiosk_room_id') || safeGetItem('groovelab_kiosk_room_id') || '';
          
          var startUrl = '/?platform=groovelab';
          if (token && stationId) {
            startUrl += '&kiosk_token=' + encodeURIComponent(token) + '&station_id=' + encodeURIComponent(stationId);
            if (roomId) {
              startUrl += '&kiosk_room_id=' + encodeURIComponent(roomId);
            }
          }
          
          manifestObj = {
            "short_name": "GrooveLab",
            "name": "GrooveLab",
            "icons": [
              {
                "src": "/pwa-icon-groovelab.png",
                "type": "image/png",
                "sizes": "192x192"
              },
              {
                "src": "/pwa-icon-groovelab.png",
                "type": "image/png",
                "sizes": "512x512"
              }
            ],
            "start_url": startUrl,
            "scope": "/",
            "background_color": "#0c0f12",
            "theme_color": "#eab308",
            "display": displayMode,
            "orientation": "any"
          };
        } else {
          manifestObj = {
            "short_name": "Campus-Groovelab",
            "name": "Campus-Groovelab",
            "icons": [
              {
                "src": "/pwa-icon.png",
                "type": "image/png",
                "sizes": "192x192"
              },
              {
                "src": "/pwa-icon.png",
                "type": "image/png",
                "sizes": "512x512"
              }
            ],
            "start_url": "/?platform=campus",
            "scope": "/",
            "background_color": "#062413",
            "theme_color": "#34a853",
            "display": displayMode,
            "orientation": "any"
          };
        }
        
        var manifestHref = isGrooveLab ? '/manifest-groovelab.json' : '/manifest.json';
        try {
          var manifestStr = JSON.stringify(manifestObj);
          if (typeof btoa === 'function') {
            manifestHref = 'data:application/manifest+json;base64,' + btoa(unescape(encodeURIComponent(manifestStr)));
          }
        } catch (e) {
          console.error('[Manifest] Failed to encode dynamic manifest:', e);
        }
        
        document.write('<link rel="manifest" href="' + manifestHref + '" />');
        document.write('<meta name="theme-color" content="' + themeColor + '" />');
        document.write('<meta name="apple-mobile-web-app-title" content="' + title + '" />');
        document.write('<link rel="apple-touch-icon" href="' + appleTouchIcon + '" />');
        document.write('<link rel="icon" type="image/png" href="' + favicon + '" />');
        
        document.write('<meta name="apple-mobile-web-app-capable" content="yes" />');
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        alert('Global Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        alert('Unhandled Promise Rejection: ' + (e.reason ? e.reason.message || e.reason : e));
      });
    </script>
    <title>Campus-Groovelab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
