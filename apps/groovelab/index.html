<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- 🛡️ Zero-Freeze Localhost Shield: Purge Service Worker & CacheStorage before module load -->
    <script>
      (function() {
        var h = window.location.hostname;
        var isLocal = h === 'localhost' || h === '127.0.0.1' || h.endsWith('.localhost') || h.endsWith('.local');
        if (isLocal) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }
      })();
    </script>
    <script src="/pwa-boot.js"></script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="preconnect" href="https://supabase.campus-groovelab.de" crossorigin />
    <link rel="dns-prefetch" href="https://supabase.campus-groovelab.de" />
    <style>
      /* Zero CLS font-display fallback */
      @font-face {
        font-family: 'Plus Jakarta Sans Fallback';
        src: local('Helvetica Neue'), local('Arial'), local('-apple-system');
        font-display: swap;
      }
      /* Critical A11y Skip Link (Zero FOUC & Keyboard Only) */
      .skip-to-content-link {
        position: fixed !important;
        top: -9999px !important;
        left: 16px !important;
        z-index: 9999999 !important;
        padding: 12px 22px !important;
        background: #0f172a !important;
        color: #ffffff !important;
        font-size: 0.92rem !important;
        font-weight: 850 !important;
        text-decoration: none !important;
        border-radius: 14px !important;
        border: 2px solid #34a853 !important;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35) !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transition: top 0.18s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease !important;
      }
      .skip-to-content-link:focus-visible {
        top: 16px !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        outline: 3px solid #34a853 !important;
        outline-offset: 3px !important;
      }
    </style>
    <title>Campus-Groovelab</title>
  </head>
