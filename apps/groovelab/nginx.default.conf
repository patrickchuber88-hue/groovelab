# ==============================================================================
# Campus-Groovelab Tier-1 BSI A+ Hardened Nginx Server Configuration
# ==============================================================================

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Hide Nginx Version
    server_tokens off;

    # 2. Strict Transport Security (HSTS - 2 Years + Preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 3. Clickjacking & Frame Protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 4. MIME-Type Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;

    # 5. Strict Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 6. Hardware & Feature Permissions Policy
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # 7. Hermetic Content Security Policy (Zero External Data Exfiltration)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de https:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # 8. Enterprise High-Speed Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 8. Optimized Static Asset Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 9. PWA Service Worker & Manifest
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 10. Health Check Endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus"}';
    }

    # 11. Main Single Page Application Entry
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
