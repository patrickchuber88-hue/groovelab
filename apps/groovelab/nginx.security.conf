# ==============================================================================
# Campus-Groovelab Tier-1 BSI A+ Hardened Nginx Configuration
# Compliant with BSI TR-03116, DSGVO Art. 32 and Mozilla Observatory A+ Standards
# ==============================================================================

# 1. Hide Nginx Version Information
server_tokens off;

# 2. Strict Transport Security (HSTS - 2 Years + Preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 3. Clickjacking & Frame Protection
add_header X-Frame-Options "SAMEORIGIN" always;

# 4. MIME-Type Sniffing Protection
add_header X-Content-Type-Options "nosniff" always;

# 5. Strict Referrer Policy (No PII Leakage in Referrers)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Hardware & Feature Permissions Policy (Hardware Protection for Minors)
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

# 7. Content Security Policy (CSP - 100% Self-Hosted DSGVO Reinform)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# 8. Cross-Origin Policies
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 9. Enterprise High-Speed Compression (Brotli + Gzip Fallback)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# 10. Optimized Static Caching & Cache-Busting
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# 11. Service Worker & Manifest (Never Cache to Ensure Immediate PWA Updates)
location = /sw.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

location = /manifest.json {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

# 12. Lightweight Health-Check Endpoint for Uptime Monitors & Load Balancers
location = /healthz {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus"}';
}

# 13. HTML Entry Point (Always Validate against Server)
location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
}
