server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    server_tokens off;

    # ── 0. Site-Gate Verification Subrequest (Internal Nginx Subrequest < 0.2ms) ──
    location = /_auth_site_gate {
        internal;
        proxy_pass http://groovelab-bff:4000/gate/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # ── Site-Gate UI Fallback (Zero-Bundle Delivery) ──
    location @access_gate {
        root /usr/share/nginx/html;
        try_files /gate.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Allowlist: Standalone Gate Page & Icons (Public Allowlist) ──
    location = /gate.html {
        root /usr/share/nginx/html;
        try_files /gate.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        try_files /favicon.svg =404;
        access_log off;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico =404;
        access_log off;
    }

    # ── Lightweight Uptime Health Check (Public Allowlist) ──
    location = /healthz {
        access_log off;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus","datacenter":"hetzner-de"}';
    }

    # 1. Routing für den BFF-Server (Gateway)
    location /api/ {
        proxy_pass http://groovelab-bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. PWA Entry Points: Geschützt durch Site-Gate
    location ~* ^/(index\.html|sw\.js|version\.json|manifest.*\.json)$ {
        auth_request /_auth_site_gate;
        error_page 401 =200 @access_gate;

        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 3. Hashed Static Assets: Geschützt durch Site-Gate
    location /assets/ {
        auth_request /_auth_site_gate;
        error_page 401 =401 @access_gate_asset;

        root /usr/share/nginx/html;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @access_gate_asset {
        return 401 '{"error":"Site access token required"}';
        add_header Content-Type application/json;
    }

    # 4. Secure Logout & Shared Device Memory Vaporization (DSGVO Art. 32)
    location = /logout {
        add_header Clear-Site-Data "\"cache\", \"storage\"" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /;
    }

    # 5. Standard Static Fallback (SPA Routing - Geschützt durch Site-Gate)
    location / {
        auth_request /_auth_site_gate;
        error_page 401 =200 @access_gate;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
