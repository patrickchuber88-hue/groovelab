server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # 1. Routing für den BFF-Server (Gateway)
    location /api/ {
        proxy_pass http://groovelab-bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. PWA Entry Points: NIEMALS cachen (garantiert sofortige Updates beim Deployment)
    location ~* ^/(index\.html|sw\.js|manifest.*\.json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 3. Hashed Static Assets: 1 Jahr aggressiv cachen + Pre-compressed Gzip
    location /assets/ {
        root /usr/share/nginx/html;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 4. Standard Static Fallback (SPA Routing)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
