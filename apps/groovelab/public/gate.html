<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Geschützter Zugang • Campus-GrooveLab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg-deep: #090d16;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gold: #facc15;
      --accent-gold-hover: #eab308;
      --accent-gold-glow: rgba(250, 204, 21, 0.16);
      --campus-green: #34a853;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.7);
      --input-border: rgba(148, 163, 184, 0.2);
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.35);
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 15%, var(--accent-gold-glow) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(52, 168, 83, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px env(safe-area-inset-bottom);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .gate-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease;
    }

    .badge-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.25);
      color: var(--accent-gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .security-badge svg {
      width: 13px;
      height: 13px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .header-text {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-text h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .header-text h1 span.gold {
      color: var(--accent-gold);
    }

    .header-text p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 46px 14px 16px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
      background: rgba(2, 6, 23, 0.9);
    }

    .input-wrapper input::placeholder {
      color: #64748b;
      font-size: 14px;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 6px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.15s, background-color 0.15s;
    }

    .toggle-pwd-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }

    .toggle-pwd-btn:focus-visible {
      outline: 2px solid var(--accent-gold);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-gold);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(250, 204, 21, 0.35);
      transition: background-color 0.15s, transform 0.1s, box-shadow 0.15s;
      min-height: 48px;
      user-select: none;
      touch-action: manipulation;
    }

    .submit-btn:hover {
      background-color: var(--accent-gold-hover);
      box-shadow: 0 6px 18px rgba(250, 204, 21, 0.45);
    }

    .submit-btn:active {
      transform: scale(0.985);
    }

    .submit-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      color: var(--error-text);
      font-size: 13px;
      line-height: 1.4;
    }

    .error-box.visible {
      display: flex;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15, 23, 42, 0.25);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    .footer-note a {
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-note a:hover {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <main class="gate-container" id="gateCard">
    <div class="badge-wrapper">
      <div class="security-badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Geschützter Schulzugang</span>
      </div>
    </div>

    <div class="header-text">
      <h1>Campus <span class="gold">GrooveLab</span></h1>
      <p>Diese Plattform befindet sich im geschützten Vorabzugang. Bitte autorisiere dich mit dem autorisierten Zugangscode.</p>
    </div>

    <div id="errorBox" class="error-box" role="alert" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMessage">Ungültiger Zugangscode. Bitte prüfe deine Eingabe.</span>
    </div>

    <!-- Progressive Enhancement: Native POST fallback if JS is disabled -->
    <form id="gateForm" method="POST" action="/api/gate/login">
      <div class="form-group">
        <label for="passwordInput">Zugangscode</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            placeholder="Zugangscode eingeben..." 
            autocomplete="current-password" 
            autofocus 
            required 
            spellcheck="false"
            aria-required="true"
          />
          <button 
            type="button" 
            class="toggle-pwd-btn" 
            id="togglePwdBtn" 
            aria-label="Passwort anzeigen"
            title="Passwort anzeigen"
          >
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
        <span id="btnText">Plattform freischalten</span>
        <svg id="arrowIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </form>

    <div class="footer-note">
      Enterprise+ Ingress Shield • OWASP ASVS Level 3 • Hetzner Datacenter DE
    </div>
  </main>

  <script>
    (function() {
      const form = document.getElementById('gateForm');
      const passwordInput = document.getElementById('passwordInput');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const arrowIcon = document.getElementById('arrowIcon');
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');
      const gateCard = document.getElementById('gateCard');
      const togglePwdBtn = document.getElementById('togglePwdBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      // 1. Password Visibility Toggle
      if (togglePwdBtn && passwordInput) {
        togglePwdBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          togglePwdBtn.setAttribute('aria-label', isPassword ? 'Passwort verbergen' : 'Passwort anzeigen');
          togglePwdBtn.setAttribute('title', isPassword ? 'Passwort verbergen' : 'Passwort anzeigen');
          
          if (isPassword) {
            eyeIcon.innerHTML = '<path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>';
          } else {
            eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
          }
        });
      }

      // 2. Fetch-based Submission with Smooth Shake Animation
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const password = passwordInput.value.trim();
        if (!password) {
          showError('Bitte gib einen Zugangscode ein.');
          return;
        }

        setLoading(true);
        hideError();

        try {
          // Attempt login via the BFF gate endpoint
          const res = await fetch('/api/gate/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ password: password })
          });

          const data = await res.json().catch(function() { return {}; });

          if (res.ok && data.success) {
            btnText.textContent = 'Freigeschaltet...';
            // Smoothly reload the root URL; Nginx will now grant access to the full app
            window.location.href = data.redirect || '/';
          } else {
            showError(data.error || 'Ungültiger Zugangscode.');
            triggerShake();
            setLoading(false);
            passwordInput.focus();
            passwordInput.select();
          }
        } catch (err) {
          // Fallback to direct form submit if fetch fails (e.g. strict CSP or network)
          form.submit();
        }
      });

      function setLoading(loading) {
        submitBtn.disabled = loading;
        btnSpinner.style.display = loading ? 'inline-block' : 'none';
        arrowIcon.style.display = loading ? 'none' : 'inline-block';
        btnText.textContent = loading ? 'Wird überprüft...' : 'Plattform freischalten';
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBox.classList.add('visible');
      }

      function hideError() {
        errorBox.classList.remove('visible');
      }

      function triggerShake() {
        gateCard.classList.remove('shake');
        // Force reflow
        void gateCard.offsetWidth;
        gateCard.classList.add('shake');
      }
    })();
  </script>
</body>
</html>
