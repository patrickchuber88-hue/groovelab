<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Geschützter Zugang • Campus-Groovelab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(226, 232, 240, 0.9);
      --campus-green: #34a853;
      --campus-green-dark: #15803d;
      --campus-green-surface: #f0fdf4;
      --campus-green-border: #bbf7d0;
      --groovelab-yellow: #eab308;
      --groovelab-yellow-bright: #facc15;
      --groovelab-yellow-hover: #eab308;
      --hyphen-color: #94a3b8;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #34a853;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(52, 168, 83, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 88% 85%, rgba(250, 204, 21, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.65) 0%, transparent 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px env(safe-area-inset-bottom);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .gate-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 28px;
      padding: 38px 32px 32px;
      box-shadow: 
        0 20px 45px -10px rgba(15, 23, 42, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .badge-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--campus-green-surface);
      border: 1px solid var(--campus-green-border);
      color: var(--campus-green-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .security-badge svg {
      width: 13px;
      height: 13px;
      color: var(--campus-green);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--campus-green);
      box-shadow: 0 0 8px rgba(52, 168, 83, 0.65);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .header-text {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-text h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .header-text h1 span.campus {
      color: var(--campus-green);
      font-weight: 800;
    }

    .header-text h1 span.hyphen {
      color: var(--hyphen-color);
      font-weight: 800;
      margin: 0 1px;
    }

    .header-text h1 span.groovelab {
      color: var(--groovelab-yellow);
      font-weight: 800;
    }

    .header-text p {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-sub);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 46px 14px 16px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(52, 168, 83, 0.18);
      background: #ffffff;
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
      font-size: 14px;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 6px;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.15s, background-color 0.15s;
    }

    .toggle-pwd-btn:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .toggle-pwd-btn:focus-visible {
      outline: 2px solid var(--campus-green);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--groovelab-yellow-bright);
      color: #0f172a;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(250, 204, 21, 0.4);
      transition: background-color 0.15s, transform 0.1s, box-shadow 0.15s;
      min-height: 48px;
      user-select: none;
      touch-action: manipulation;
    }

    .submit-btn:hover {
      background-color: var(--groovelab-yellow-hover);
      box-shadow: 0 6px 18px rgba(234, 179, 8, 0.5);
    }

    .submit-btn:active {
      transform: scale(0.985);
    }

    .submit-btn:focus-visible {
      outline: 2px solid #0f172a;
      outline-offset: 2px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      color: var(--error-text);
      font-size: 13px;
      line-height: 1.4;
    }

    .error-box.visible {
      display: flex;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15, 23, 42, 0.25);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <main class="gate-container" id="gateCard">
    <div class="badge-wrapper">
      <div class="security-badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Geschützter Schulzugang</span>
      </div>
    </div>

    <div class="header-text">
      <h1>
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" style="display:inline-block; vertical-align:middle; margin-right:8px; flex-shrink:0;">
          <path d="M7 6.8L18 3.8V6.6L7 9.6Z" fill="#34a853"/>
          <line x1="7" y1="7" x2="7" y2="16.5" stroke="#34a853" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="18" y1="4" x2="18" y2="13.5" stroke="#34a853" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="5" cy="17" rx="3.2" ry="2.4" transform="rotate(-24 5 17)" fill="#34a853"/>
          <ellipse cx="16" cy="14" rx="3.2" ry="2.4" transform="rotate(-24 16 14)" fill="#34a853"/>
        </svg>
        <span class="campus">Campus</span><span class="hyphen">-</span><span class="groovelab">Groovelab</span>
      </h1>
      <p>Diese Plattform befindet sich im geschützten Vorabzugang. Bitte autorisiere dich mit dem gültigen Zugangscode.</p>
    </div>

    <div id="errorBox" class="error-box" role="alert" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorMessage">Ungültiger Zugangscode. Bitte prüfe deine Eingabe.</span>
    </div>

    <!-- Progressive Enhancement: Native POST fallback if JS is disabled -->
    <form id="gateForm" method="POST" action="/api/gate/login">
      <div class="form-group">
        <label for="passwordInput">Zugangscode</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            placeholder="Zugangscode eingeben..." 
            autocomplete="current-password" 
            autofocus 
            required 
            spellcheck="false"
            aria-required="true"
          />
          <button 
            type="button" 
            class="toggle-pwd-btn" 
            id="togglePwdBtn" 
            aria-label="Passwort anzeigen"
            title="Passwort anzeigen"
          >
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
        <span id="btnText">Plattform freischalten</span>
        <svg id="arrowIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </form>

    <div class="footer-note">
      Enterprise+ Ingress Shield • OWASP ASVS Level 3 • Sovereign Cloud DE
    </div>
  </main>

  <script src="/gate.js" defer></script>
</body>
</html>
