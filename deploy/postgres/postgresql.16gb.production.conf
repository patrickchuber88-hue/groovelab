# ==============================================================================
# 🛡️ Campus-Groovelab PostgreSQL 15 High-Performance Configuration (16 GB Node)
# Platform: Campus-Groovelab (https://campus-groovelab.de)
# Calibrated for: IONOS Memory Cube M (4 vCores / 16 GB RAM / 240 GB SSD) or Netcup
# Standards: Tier-1 Enterprise+ / BSI IT-Grundschutz (OPS.1.1.4, DER.4) / OWASP ASVS L3
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MEMORY & RESOURCE ALLOCATION (16 GB RAM Calibration)
# ------------------------------------------------------------------------------
# 25% of RAM dedicated to PostgreSQL shared buffer cache:
shared_buffers = 4096MB

# 75% of RAM estimated available for OS page cache + shared buffers:
effective_cache_size = 12288MB

# Dedicated sorting/hash memory per query operation:
work_mem = 64MB

# Memory budget for VACUUM, CREATE INDEX, and table migrations:
maintenance_work_mem = 1024MB

# Memory buffer for WAL data before flushing:
wal_buffers = 64MB

# Temp buffers per session:
temp_buffers = 16MB

# ------------------------------------------------------------------------------
# 2. WRITE-AHEAD-LOG (WAL) & CONTINUOUS ARCHIVING (pgBackRest / RPO < 60s)
# ------------------------------------------------------------------------------
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=campus_db archive-push %p'
archive_timeout = 300

# ------------------------------------------------------------------------------
# 3. CHECKPOINTS & DISK I/O SMOOTHING (High-IOPS Local SSD/NVMe)
# ------------------------------------------------------------------------------
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min

# ------------------------------------------------------------------------------
# 4. CONNECTIONS & LEAK SHIELD
# ------------------------------------------------------------------------------
max_connections = 150
statement_timeout = 30000                   # 30s abort for frozen queries
idle_in_transaction_session_timeout = 15000 # 15s abort for orphaned transactions
lock_timeout = 10000                        # 10s abort for lock acquisitions

tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# ------------------------------------------------------------------------------
# 5. QUERY PLANNER TUNING (Direct NVMe / Fast SSD Bus)
# ------------------------------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# ------------------------------------------------------------------------------
# 6. LOGGING & AUDIT TRAIL
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
