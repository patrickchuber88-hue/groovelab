# ==============================================================================
# 🛡️ Campus-Groovelab PostgreSQL 15 Production Configuration
# Standard: Tier-1 Enterprise+ / BSI IT-Grundschutz / OWASP ASVS Level 3
# Calibrated 100% for Hetzner Cloud 4 GB RAM Host (All-in-One Supabase Stack)
# Location: /etc/postgresql/postgresql.conf (or volume mount in supabase-db)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MEMORY & RESOURCE ALLOCATION (4 GB RAM All-in-One Calibration)
# ------------------------------------------------------------------------------
# Dedicated Shared Buffer Pool: 512 MB (12.5% of 4 GB RAM)
# Leaves ample memory for Coolify, Kong, Traefik, GoTrue, Realtime, BFF & Storage
shared_buffers = 512MB

# Estimated memory available for disk caching by OS and PostgreSQL
# Realistic value for 4 GB RAM with running companion microservices
effective_cache_size = 1536MB

# Maximum memory to be used by each query operation (e.g. hash table, sort)
# 8 MB x 60 active connections = max 480 MB dynamic query memory
work_mem = 8MB

# Memory budget for maintenance operations (VACUUM, CREATE INDEX, ALTER TABLE)
maintenance_work_mem = 128MB

# Dedicated buffer for unwritten WAL data
wal_buffers = 16MB

# Temp buffers per session for temporary tables
temp_buffers = 8MB

# ------------------------------------------------------------------------------
# 2. WRITE-AHEAD-LOG (WAL) & CONTINUOUS ARCHIVING (pgBackRest / RPO < 60s)
# ------------------------------------------------------------------------------
# WAL level required for physical streaming replication & PITR archiving
wal_level = replica

# Enable continuous WAL archiving to external storage
archive_mode = on

# Invokes pgBackRest archive-push to stream WAL segments to Hetzner Storage Box
archive_command = 'pgbackrest --stanza=campus_db archive-push %p'

# Force WAL segment flush every 5 minutes if traffic is low
# Guarantees maximum data loss window is well under 5 minutes even on idle hours
archive_timeout = 300

# ------------------------------------------------------------------------------
# 3. CHECKPOINTS & DISK I/O SMOOTHING
# ------------------------------------------------------------------------------
# Spreads checkpoint writes across 90% of the checkpoint interval
# Eliminates Ceph network volume I/O latency spikes and disk stalls
checkpoint_completion_target = 0.9

# Maximum distance between automatic WAL checkpoints
max_wal_size = 2GB
min_wal_size = 512MB

# Checkpoint frequency: balances recovery time vs. I/O load
checkpoint_timeout = 10min

# ------------------------------------------------------------------------------
# 4. CONNECTIONS & SESSIONS (Connection Leaks & Thread Exhaustion Shield)
# ------------------------------------------------------------------------------
# Max client connections directly to Postgres (backed by Supavisor / Pooler)
max_connections = 120

# Reclaim server resources if a query hangs or blocks
statement_timeout = 30000                   # 30s abort for frozen queries
idle_in_transaction_session_timeout = 15000 # 15s abort for orphaned transactions
lock_timeout = 10000                        # 10s abort for lock acquisitions

# TCP Keepalive to purge dead client connections across Hetzner vSwitch
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# ------------------------------------------------------------------------------
# 5. QUERY PLANNER TUNING (SSD / NVMe Disk Profiles)
# ------------------------------------------------------------------------------
# Set for local NVMe / High-IOPS storage (Default HDD is 4.0)
random_page_cost = 1.1
seq_page_cost = 1.0

# Asynchronous I/O concurrency depth for SSD/NVMe
effective_io_concurrency = 200

# ------------------------------------------------------------------------------
# 6. LOGGING & AUDIT TRAIL
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ------------------------------------------------------------------------------
# TARGET STATE REFERENCE (16 GB DEDICATED CCX23 DATABASE NODE)
# When transitioning to Tier-2 architecture, apply these parameters:
# ------------------------------------------------------------------------------
# shared_buffers = 4096MB
# effective_cache_size = 12288MB
# work_mem = 64MB
# maintenance_work_mem = 1024MB
# wal_buffers = 64MB
# max_connections = 200
# max_wal_size = 8GB
# min_wal_size = 1GB
