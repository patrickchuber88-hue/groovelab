# ==============================================================================
# 🛡️ Campus-Groovelab Tier-1 Production Nginx Ingress: campus-groovelab.de
# Standards: OWASP ASVS Level 3 / BSI TR-03116 / DSGVO Art. 32
# Destination on Hetzner Host: /etc/nginx/sites-available/campus-groovelab.de.conf
# ==============================================================================

# 1. HTTP Ingress → HTTPS 301 Redirect & ACME Challenge Webroot
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de;

    server_tokens off;

    # Let's Encrypt ACME Challenge Pass-through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server (Enterprise+ Production Gateway)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de;

    server_tokens off;

    # ── Host Header Sanitization (OWASP ASVS 14.3.1) ──
    if ($host !~* ^(campus-groovelab\.de|www\.campus-groovelab\.de)$) {
        return 444;
    }

    # ── TLS & Cryptographic Hardening (Let's Encrypt / BSI TR-03116) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Slowloris & DoS Protection ──
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    client_max_body_size 60M;
    large_client_header_buffers 4 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # ── Document Root (Vite Production Build - Atomic Symlink) ──
    root /var/www/groovelab/current;
    index index.html;

    # ── Gzip Compression (With Pre-Compressed Static Support) ──
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Enterprise Security Headers (OWASP ASVS Level 3 / Mozilla Observatory A+) ──
    include /etc/nginx/snippets/security-headers.conf;

    # ── 1. SPA Routing: HTML Requests ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── 2. Immutable Static Assets (Vite Bundles with Hash) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── 3. PWA Service Worker, Version Info & Manifest (Never Cache) ──
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /version.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── 4. Lightweight Uptime Health Check ──
    location = /healthz {
        access_log off;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus","datacenter":"hetzner-de"}';
    }

    # ── 5. RFC 9116 security.txt ──
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── 6. Groovelab BFF API Bridge (Express Backend) ──
    location /api/bff/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ── 7. Master Admin Split-Perimeter Shield (Protected Entrypoint) ──
    location ^~ /master-admin {
        try_files $uri $uri/ /index.html;
        # Rate-limiting for admin console
        limit_req zone=tenant_api_limit burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
