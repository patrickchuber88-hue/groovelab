# ==============================================================================
# 🛡️ Campus-Groovelab Tier-1 Production Nginx Ingress: campus-groovelab.de
# Standards: OWASP ASVS Level 3 / BSI TR-03116 / DSGVO Art. 32
# Destination on Hetzner Host: /etc/nginx/sites-available/campus-groovelab.de.conf
# ==============================================================================

# 0. Authoritative Rate-Limiting Zones ([P2-3] Anti-Brute-Force & DoS Shield)
limit_req_zone $binary_remote_addr zone=campus_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_api_limit:10m rate=20r/s;

# 1. HTTP Ingress → HTTPS 301 Redirect & ACME Challenge Webroot
server {
    listen 80;
    listen [::]:80;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    server_tokens off;

    # Let's Encrypt ACME Challenge Pass-through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server (Enterprise+ Production Gateway)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campus-groovelab.de www.campus-groovelab.de *.campus-groovelab.de;

    server_tokens off;

    # ── Host Header Sanitization (OWASP ASVS 14.3.1) ──
    if ($host !~* ^([a-zA-Z0-9_-]+\.)*campus-groovelab\.de$) {
        return 444;
    }

    # ── TLS & Cryptographic Hardening (Let's Encrypt / BSI TR-03116) ──
    ssl_certificate     /etc/letsencrypt/live/campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-groovelab.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ── Elliptic Curves / KEM Groups (X25519-Prio; BSI TR-02102) ──
    ssl_ecdh_curve      X25519:secp256r1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_tickets off;
    ssl_early_data      off;
    ssl_buffer_size     4k;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/campus-groovelab.de/chain.pem;
    # [P3-1] Sovereign EU/DE OCSP DNS Resolvers (Hetzner Germany + DNS0.eu — 0% US-Cloud)
    resolver 185.12.64.1 185.12.64.2 193.110.81.0 valid=300s;
    resolver_timeout 5s;

    # ── Slowloris & DoS Protection ──
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    client_max_body_size 60M;
    large_client_header_buffers 4 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # ── Document Root (Vite Production Build - Atomic Symlink) ──
    root /var/www/groovelab/current;
    index index.html;

    # ── Gzip Compression (With Pre-Compressed Static Support) ──
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Enterprise Security Headers (OWASP ASVS Level 3 / Mozilla Observatory A+) ──
    include /etc/nginx/snippets/security-headers.conf;

    # ── 0. Site-Gate Verification Subrequest (Internal Nginx Subrequest < 0.2ms) ──
    location = /_auth_site_gate {
        internal;
        proxy_pass http://127.0.0.1:4000/gate/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # ── Site-Gate UI Fallback (Zero-Bundle Delivery for Unauthorized Requests) ──
    location @access_gate {
        try_files /gate.html =503;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header x-site-gate "1" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Allowlist: Standalone Gate Page & Essential Icons (No Auth Required) ──
    location = /gate.html {
        try_files /gate.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header x-site-gate "1" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /gate.js {
        try_files /gate.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        access_log off;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
    }

    # ── 1. SPA Routing: HTML Requests (Protected by Site-Gate) ──
    location / {
        auth_request /_auth_site_gate;
        error_page 401 =200 @access_gate;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── 2. Immutable Static Assets (Vite Bundles with Hash - Publicly Accessible for anonymous CORS/Fetch) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── 3. PWA Bootloader, Service Worker & Icons (Public Allowlist - Never Gate Blocked) ──
    location = /pwa-boot.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /pwa-recovery.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* ^/(apple-touch-icon.*\.png|pwa-icon.*\.png|favicon.*)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /version.json {
        default_type application/json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest-groovelab.json {
        default_type application/manifest+json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── 4. Lightweight Uptime Health Check (Public Allowlist) ──
    location = /healthz {
        access_log off;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus","datacenter":"hetzner-de"}';
    }

    # ── 5. RFC 9116 security.txt (Public Allowlist) ──
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── 6. Groovelab BFF API Bridge (Express Backend) ──
    location /api/ {
        limit_req zone=campus_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /api/bff/ {
        limit_req zone=campus_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ── Site-Gate Direct API Alias ──
    location /api/gate/ {
        limit_req zone=campus_auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000/gate/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── 7. Master Admin Split-Perimeter Shield (Protected Entrypoint) ──
    location ^~ /master-admin {
        auth_request /_auth_site_gate;
        error_page 401 = @access_gate;

        try_files $uri $uri/ /index.html;
        # Rate-limiting for admin console (10r/m, burst 5)
        limit_req zone=campus_auth_limit burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── 8. Secure Logout & Shared Device Memory Vaporization (DSGVO Art. 32) ──
    location = /logout {
        add_header Clear-Site-Data "\"cache\", \"storage\"" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /;
    }

    # ── 9. CIS-Perimeter Hardening: Hidden Dotfiles & Sensitive Backups ──
    # Block hidden files except .well-known (RFC 9116 security.txt & Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block sensitive backup, dump, environment and configuration files
    location ~* \.(bak|config|sql|tar|gz|zip|env|sh|inc|swp|md)$ {
        deny all;
        return 404;
    }
}
