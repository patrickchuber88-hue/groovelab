# ==============================================================================
# 🛡️ Campus-Groovelab Tier-1 Production Nginx Ingress: supabase.campus-groovelab.de
# Standards: OWASP ASVS Level 3 / BSI TR-03116 / DSGVO Art. 32
# Destination on Hetzner Host: /etc/nginx/sites-available/supabase.campus-groovelab.de.conf
# ==============================================================================

# 0. Authoritative Rate-Limiting Zone for Supabase REST & Storage Gateway ([P2-3])
limit_req_zone $binary_remote_addr zone=supabase_rest_limit:10m rate=30r/s;

# 1. HTTP Ingress → HTTPS 301 Redirect & ACME Challenge Webroot
server {
    listen 80;
    listen [::]:80;
    server_name supabase.campus-groovelab.de;

    server_tokens off;

    # Let's Encrypt ACME Challenge Pass-through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Gateway Proxy (Forwards to Supabase Kong Gateway on 127.0.0.1:8000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase.campus-groovelab.de;

    server_tokens off;

    # ── TLS & Cryptographic Hardening (Let's Encrypt / BSI TR-03116) ──
    ssl_certificate     /etc/letsencrypt/live/supabase.campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.campus-groovelab.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ── Elliptic Curves / KEM Groups (X25519-Prio; BSI TR-02102) ──
    ssl_ecdh_curve      X25519:secp256r1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_tickets off;
    ssl_early_data      off;
    ssl_buffer_size     4k;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/supabase.campus-groovelab.de/chain.pem;
    # [P3-1] Sovereign EU/DE OCSP DNS Resolvers (Hetzner Germany + DNS0.eu — 0% US-Cloud)
    resolver 185.12.64.1 185.12.64.2 193.110.81.0 valid=300s;
    resolver_timeout 5s;

    # ── Body Limits for Audio-Tresor & Media Storage (50 MB) ──
    client_max_body_size 60M;
    client_body_buffer_size 512k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # ── Enterprise Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Storage Downloads: Force Attachment (OWASP ASVS Stored-XSS Protection) ──
    location /storage/v1/object/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Force download dialog on user files to disarm stored HTML/SVG script execution
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── PostgREST Schema-Cloaking (Reconnaissance Shield) ──
    # Block unauthenticated root OpenAPI schema introspection (PGRST Reconnaissance Shield)
    # Allows HEAD probes for client-side connection & circuit-breaker heartbeat
    location = /rest/v1/ {
        if ($request_method !~ ^(HEAD|OPTIONS)$) {
            return 404;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /rest/v1 {
        if ($request_method !~ ^(HEAD|OPTIONS)$) {
            return 404;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ── Kong API Gateway Reverse Proxy (PostgREST, GoTrue, Realtime, Storage) ──
    location / {
        limit_req zone=supabase_rest_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSockets Support (Crucial for Supabase Realtime / Live Lab / Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # [P2-3] Authoritative Proxy Headers: Overwrite X-Forwarded-For with $remote_addr & strip CF-Connecting-IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Long-lived Timeouts for Persistent Realtime WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # Buffering: Disable buffering for Realtime event streams
        proxy_buffering off;
    }
}
