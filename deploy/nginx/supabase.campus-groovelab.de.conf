# ==============================================================================
# 🛡️ Campus-Groovelab Tier-1 Production Nginx Ingress: supabase.campus-groovelab.de
# Standards: OWASP ASVS Level 3 / BSI TR-03116 / DSGVO Art. 32
# Destination on Hetzner Host: /etc/nginx/sites-available/supabase.campus-groovelab.de.conf
# ==============================================================================

# 1. HTTP Ingress → HTTPS 301 Redirect & ACME Challenge Webroot
server {
    listen 80;
    listen [::]:80;
    server_name supabase.campus-groovelab.de;

    server_tokens off;

    # Let's Encrypt ACME Challenge Pass-through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Gateway Proxy (Forwards to Supabase Kong Gateway on 127.0.0.1:8000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase.campus-groovelab.de;

    server_tokens off;

    # ── TLS & Cryptographic Hardening (Let's Encrypt / BSI TR-03116) ──
    ssl_certificate     /etc/letsencrypt/live/supabase.campus-groovelab.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.campus-groovelab.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Body Limits for Audio-Tresor & Media Storage (50 MB) ──
    client_max_body_size 60M;
    client_body_buffer_size 512k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # ── Enterprise Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Kong API Gateway Reverse Proxy (PostgREST, GoTrue, Realtime, Storage) ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSockets Support (Crucial for Supabase Realtime / Live Lab / Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Long-lived Timeouts for Persistent Realtime WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # Buffering: Disable buffering for Realtime event streams
        proxy_buffering off;
    }
}
