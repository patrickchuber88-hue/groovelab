# ==============================================================================
# Campus-Groovelab Tier-1 BSI TR-02102 & Mozilla Observatory A+ Header Suite
# Defense-in-Depth: BSI TR-03116, DSGVO Art. 32, Schrems-II Sovereign Hetzner
# ==============================================================================

# 1. Strict Transport Security (HSTS - 2 Years / Preload Ready)
# 63,072,000 seconds = exactly 2 years; required for https://hstspreload.org
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 3. Frame Protection (Clickjacking & UI-Redressing Immunity)
add_header X-Frame-Options "DENY" always;

# 4. MIME-Type Sniffing Protection
add_header X-Content-Type-Options "nosniff" always;

# 5. Strict Referrer Policy (Zero PII Path/Token Leakage Across Origins)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Hardware & Permissions Policy (Restricts Device Capabilities to Microphone Only)
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), display-capture=()" always;

# 7. Content Security Policy (CSP - Sovereign Monolith Mode)
# Calibrated for: Supabase Self-Hosted, Web Audio Engine, WebAssembly & Realtime WSS
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

# 8. Cross-Origin Isolation & Spectre/Meltdown Protection
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
