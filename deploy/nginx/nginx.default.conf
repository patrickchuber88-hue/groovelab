# ==============================================================================
# Campus-Groovelab Tier-1 Production Nginx Server Configuration
# ==============================================================================

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version
    server_tokens off;

    # Global Enterprise High-Speed Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Default server-level security headers
    include /etc/nginx/conf.d/security-headers.conf;

    # 1. SPA Routing: all HTML requests served via index.html with no-cache validation
    location / {
        try_files $uri $uri/ /index.html;
        # Cache control for SPA HTML entry
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        # Include security headers in location block so they are never overridden
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 2. Immutable Static Assets (Vite Bundles with Hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # Preserve all security headers
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 3. PWA Service Worker & Manifest (Never Cache)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 4. Lightweight Health Check
    location = /healthz {
        access_log off;
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.conf;
        return 200 '{"status":"ok","platform":"Campus-Groovelab","tier":"enterprise-plus"}';
    }

    # 5. RFC 9116 security.txt
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }
}
