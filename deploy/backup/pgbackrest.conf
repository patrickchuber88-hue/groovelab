# ==============================================================================
# 🛡️ Campus-Groovelab pgBackRest Enterprise Configuration
# Platform: Campus-Groovelab (https://campus-groovelab.de)
# Calibrated 100% for Hetzner Cloud VM & Hetzner Storage Box u664755
# Target: Continuous WAL Archiving (RPO < 60s) & Automated Restore (RTO < 15min)
# Location on Server: /etc/pgbackrest/pgbackrest.conf
# ==============================================================================

[global]
# Hetzner Storage Box SFTP Configuration (Port 23)
repo1-type=sftp
repo1-host=u664755.your-storagebox.de
repo1-host-user=u664755
repo1-host-port=23
repo1-host-key-type=ed25519
repo1-path=/backups/pgbackrest

# Encryption at rest (AES-256-CBC)
# SICHERHEITSHINWEIS: Niemals Passwörter im Git-Repository committen!
# Das Passwort wird bei der Server-Installation via setup_pgbackrest_wal_stream.sh
# dynamisch generiert oder aus der Umgebungsvariable PGBACKREST_REPO1_CIPHER_PASS bezogen.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=__PGBACKREST_CIPHER_PASS_PLACEHOLDER__

# Backup Retention Policies
repo1-retention-full=14               # Keep 14 daily full backups
repo1-retention-diff=7                # Keep differential backups for 7 days
repo1-retention-archive-type=full     # Prune WALs when associated full backup expires

# Compression & Performance (Calibrated for 2 vCPU / 4 GB RAM Host)
compress-type=lz4                     # Ultra-fast LZ4 compression with minimal CPU overhead
compress-level=3                      # Balanced compression ratio and latency
process-max=2                         # Max parallel processes: 2 (matches 2 vCPU core count)

# Buffer and Logging settings
buffer-size=4MiB
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest

# Strict TLS and SSH validation
start-fast=y                          # Fast checkpoint start for backups
stop-auto=y                           # Stop backup automatically if aborted

# ------------------------------------------------------------------------------
# Stanza Definition: campus_db (Supabase PostgreSQL 15 Container)
# ------------------------------------------------------------------------------
[campus_db]
pg1-path=/var/lib/supabase_nvme/data   # High-IOPS Local NVMe path
pg1-user=postgres
pg1-port=5432
pg1-socket-path=/var/run/postgresql

# When running pgBackRest from the host targeting the containerized Postgres:
pg1-host-type=local
