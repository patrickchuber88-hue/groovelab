# ==============================================================================
# Campus-Groovelab Enterprise Nginx WAF & Edge Rate-Limiting Configuration
# Standard: OWASP Top 10 / NIST ASVS Level 3
# ==============================================================================

# Rate Limiting Zones (Memory allocated: 10MB per zone ~160k IP entries)
limit_req_zone $binary_remote_addr zone=campus_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=campus_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_upload_limit:10m rate=5r/s;

# Connection Limit Zone (Max simultaneous connections per client IP)
limit_conn_zone $binary_remote_addr zone=campus_conn_limit:10m;

# Enterprise Security Headers (OWASP ASVS Level 3 / Norton Cyber Defense Goldstandard)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https://supabase.campus-groovelab.de wss://supabase.campus-groovelab.de; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

# Gzip & Static Compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

# Edge Caching Directives for Public Directory RPCs (P1)
# Provides sub-5ms caching for school search & theme endpoints
map $request_uri $campus_cache_control {
    ~*^/rest/v1/rpc/(search_public_schools|get_public_school_theme) "public, max-age=60, s-maxage=300, stale-while-revalidate=600";
    default "no-cache, no-store, must-revalidate";
}

# ==============================================================================
# Adaptive ZTNA Geofencing & Threat Mitigation (Silent Edge Rejection)
# Legal Basis: Art. 6 (1) lit. f & Art. 32 DSGVO; § 8 AGB (Exportkontrolle & Sanktionen)
# 
# Invarianten:
# 1. 100% Urlaubs-Resilienz: Schüler & Lehrkräfte greifen weltweit (EU/EWR & Roaming) zu.
# 2. MasterAdmin-Schutz: Leitstand-Endpunkte sind strikt auf DACH (DE, AT, CH) beschränkt.
# 3. Threat-Drop: Länder mit 0% Schülern und massiven Botnetzen (RU, BY, KP, IR, CN) werden
#    lautlos abgewiesen (HTTP 403 / TCP Drop), ohne Aufklärungsdaten (Reconnaissance) preiszugeben.
# ==============================================================================
map $geoip2_data_country_code $campus_geo_threat_level {
    default                 "trusted";
    # High-Risk / Embargo-Länder mit primär bösartigem Botnet-Traffic
    RU                      "blocked";
    BY                      "blocked";
    KP                      "blocked";
    IR                      "blocked";
    CN                      "blocked";
}

map $geoip2_data_country_code $master_admin_geo_allowed {
    default                 0;
    DE                      1;
    AT                      1;
    CH                      1;
}

