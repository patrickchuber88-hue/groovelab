# ==============================================================================
# Campus-Groovelab Enterprise Nginx WAF & Edge Rate-Limiting Configuration
# Standard: OWASP Top 10 / NIST ASVS Level 3
# ==============================================================================

# Rate Limiting Zones (Memory allocated: 10MB per zone ~160k IP entries)
limit_req_zone $binary_remote_addr zone=campus_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=campus_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=campus_upload_limit:10m rate=5r/s;

# Connection Limit Zone (Max simultaneous connections per client IP)
limit_conn_zone $binary_remote_addr zone=campus_conn_limit:10m;

# Enterprise Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# Gzip & Static Compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
